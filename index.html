      "느끼한": "느끼함", "느끼": "느끼함",
      "담백한": "담백함", "담백": "담백함",
      "짠": "짭짤함", "짭잘": "짭짤함",
      "고소한": "고소함", "꼬숩": "고소함",
      "개운한": "개운함", "깔끔": "개운함",
      "무거운": "묵직함", "무겁다": "묵직함", "든든": "묵직함",
      "달콤": "달달함", "단맛": "달달함",
      "고기": "고기", "육류": "고기",
      "마요": "마요네즈"
    };

    // 부정 표현을 감지하는 패턴과 해당 키워드
    const negationPatterns = [
      // "A는 아닌", "A는 싫", "A는 별로", "A 빼고", "A 제외"
      { pattern: /(\S+)\s*(?:는|은)?\s*(?:아닌|아니|싫|별로|빼고|제외)/, type: "suffix"},
      // "안 A", "A 안"
      { pattern: /안\s*(\S+)/, type: "prefix"},
      { pattern: /(\S+)\s*안/, type: "suffix"}
    ];

    const samgimList = [
       { name: "동원 참치김치", keywords: ["참치", "김치", "개운함", "매콤함"] },
       { name: "동원 참치마요", keywords: ["참치", "마요네즈", "고소함", "느끼함"] },
       { name: "더큰! 참치마요", keywords: ["참치", "마요네즈", "고소함", "느끼함", "묵직함"] },
       { name: "더큰! 청양참치마요", keywords: ["참치", "마요네즈", "청양고추", "매콤함", "느끼함", "묵직함"] },
       { name: "더큰! 전주비빔", keywords: ["고추장", "채소", "매콤함", "새콤함", "묵직함"] },
       { name: "더큰! 춘천닭갈비", keywords: ["닭고기", "고추장", "매콤함", "묵직함", "고기"] },
       { name: "더큰! 제육볶음", keywords: ["돼지고기", "고추장", "매콤함", "짭짤함", "묵직함", "고기"] },
       { name: "더큰! 스팸김치볶음", keywords: ["스팸", "김치", "짭짤함", "개운함", "묵직함", "고기"] },
       { name: "더큰! 간장불고기", keywords: ["소고기", "간장", "달달함", "짭짤함", "담백함", "고기", "묵직함"] },
       { name: "백종원 비빔밥", keywords: ["채소", "고추장", "매콤함", "새콤함", "담백함"] },
       { name: "백종원 연탄불고기", keywords: ["돼지고기", "간장", "불향", "달달함", "짭짤함", "고기"] },
       { name: "맵칼 어묵 삼각김밥", keywords: ["어묵", "매콤함", "짭짤함", "개운함"]},
       { name: "통통햄 야채볶음밥", keywords: ["햄", "채소", "고소함", "짭짤함", "고기"]},
       { name: "콘치즈닭갈비", keywords: ["닭고기", "치즈", "옥수수", "매콤함", "달달함", "고기"]},
       { name: "치즈폭탄 주먹밥", keywords: ["치즈", "마요네즈", "김가루", "느끼함", "고소함", "짭짤함"]},
       { name: "계란장조림", keywords: ["계란", "간장", "짭짤함", "달달함", "담백함"] },
       { name: "치즈불닭", keywords: ["치즈", "닭고기", "매콤함", "느끼함", "자극적", "고기"] },
       { name: "스팸참치마요", keywords: ["스팸", "참치", "마요네즈", "고소함", "짭짤함", "느끼함", "고기"] },
       { name: "대게딱지장", keywords: ["게살", "고소함", "비릿함", "짭짤함"] },
       { name: "스팸계란", keywords: ["스팸", "계란", "짭짤함", "고소함", "느끼함", "고기"] },
       { name: "맛있는 숙성김치", keywords: ["김치", "개운함", "매콤함", "새콤함"]},
       { name: "새우마요", keywords: ["새우", "마요네즈", "고소함", "느끼함", "튀김"] },
       { name: "갓김치햄볶음밥", keywords: ["햄", "김치", "매콤함", "개운함", "묵직함", "고기"] },
       { name: "숯불갈비맛", keywords: ["숯불", "돼지고기", "불향", "달달함", "짭짤함", "고기"] },
       { name: "소고기볶음고추장", keywords: ["소고기", "고추장", "짭짤함", "매콤함", "묵직함", "고기"] },
       { name: "스팸김치볶음", keywords: ["스팸", "김치", "짭짤함", "개운함", "묵직함", "고기"] },
       { name: "고추장불고기", keywords: ["돼지고기", "고추장", "매콤함", "짭짤함", "고기"] },
       { name: "매콤 멸추어묵", keywords: ["멸치", "청양고추", "어묵", "짭짤함", "매콤함", "개운함"] },
       { name: "풀무원 두부김치 비건", keywords: ["채식", "두부", "김치", "담백함", "개운함", "비건", "가벼움"] },
       { name: "풀무원 두부텐더 마요 비건", keywords: ["채식", "두부", "마요네즈", "담백함", "고소함", "비건", "가벼움"] },
       { name: "두툼떡갈비", keywords: ["떡갈비", "달달함", "짭짤함", "묵직함", "고기"] },
       { name: "버터장조림", keywords: ["버터", "소고기", "간장", "달달함", "고소함", "느끼함", "짭짤함", "고기"] }
    ];

    // --- 함수 정의 ---

    /**
     * 입력창, 결과 영역, 이스터에그 영역을 초기화합니다.
     */
    function retry() {
      document.getElementById("userInput").value = ""; // 입력창 비우기
      document.getElementById("resultArea").innerHTML = "결과가 여기에 표시됩니다."; // 결과 영역 초기화
      document.getElementById("easterEgg").style.display = "none"; // 이스터에그 숨기기
      document.getElementById("sandwichImageBox").style.display = "none"; // 샌드위치 이미지 박스 숨기기
      console.log("Retry requested - Fields cleared."); // 콘솔 로그
    }

    /**
     * 입력 텍스트를 분석하여 긍정/부정 키워드를 추출합니다.
     * @param {string} inputText - 사용자가 입력한 원본 텍스트
     * @returns {{positive: string[], negative: string[]}} - 추출된 긍정/부정 키워드 배열
     */
    function parseInput(inputText) {
      let processedInput = inputText.toLowerCase().trim(); // 소문자 변환, 공백 제거
      const positiveKeywords = new Set();
      const negativeKeywords = new Set();

      // 1. 동의어 표준화 (먼저 처리해야 부정 패턴에서 표준화된 키워드 사용 가능)
      Object.entries(synonymMap).forEach(([synonym, canonical]) => {
        processedInput = processedInput.replaceAll(synonym, canonical);
      });

      // 2. 부정 패턴 감지 및 해당 키워드 추출
      negationPatterns.forEach(({ pattern, type }) => {
         let match;
         const regex = new RegExp(pattern, 'g'); // 전역 검색으로 여러 번 등장하는 패턴 처리
         while ((match = regex.exec(processedInput)) !== null) {
             let keyword = "";
             if (type === 'prefix' && match[1]) { // "안 A" 형태
                 keyword = match[1].trim();
             } else if (type === 'suffix' && match[1]) { // "A 는 아닌" 형태 등
                 keyword = match[1].trim();
             }

             // 추출된 단어가 실제 키워드 목록이나 동의어 목록에 있는지 확인
             const targetKeyword = keywords.includes(keyword) ? keyword : null; // 표준화된 키워드만 사용

             if (targetKeyword) {
                 negativeKeywords.add(targetKeyword);
                 // 처리된 부정 표현은 이후 긍정 키워드 추출에서 제외하기 위해 임시로 제거 (완벽하진 않음)
                 processedInput = processedInput.replace(match[0], "");
                 console.log(`Negative pattern detected: '${match[0]}' -> added '${targetKeyword}' to negative.`);
             }
         }
      });

      // 3. 긍정/부정 분리 표현 ("A 좋은데 B 싫어", "A 이고 B") 처리
      const splitters = /좋은데|인데|하지만|그렇지만|이고|이면서/;
      if (splitters.test(processedInput)) {
        const parts = processedInput.split(splitters);
        // 첫 번째 부분을 긍정 후보로 간주
        keywords.forEach(k => {
          if (parts[0].includes(k) && !negativeKeywords.has(k)) {
            positiveKeywords.add(k);
             console.log(`Positive (from split part 1): '${k}'`);
          }
        });
        // 나머지 부분을 부정 후보로 간주 (더 정교한 로직 필요 가능성 있음)
        if (parts.length > 1) {
          const latterParts = parts.slice(1).join(" ");
          keywords.forEach(k => {
            if (latterParts.includes(k) && !positiveKeywords.has(k)) {
              negativeKeywords.add(k);
               console.log(`Negative (from split part 2): '${k}'`);
            }
          });
        }
      } else {
        // 분리 표현이 없는 경우, 남은 processedInput에서 긍정 키워드 추출
        keywords.forEach(k => {
          if (processedInput.includes(k) && !negativeKeywords.has(k)) {
            positiveKeywords.add(k);
             console.log(`Positive (no split): '${k}'`);
          }
        });
      }


      return { positive: Array.from(positiveKeywords), negative: Array.from(negativeKeywords) };
    }

    /**
     * 추출된 키워드를 기반으로 삼각김밥을 추천합니다.
     * @param {{positive: string[], negative: string[]}} extractedKeywords - 긍정/부정 키워드 객체
     * @returns {string} - 추천 결과 메시지
     */
    function recommendSamgim(extractedKeywords) {
      const { positive, negative } = extractedKeywords;
      const possibleRecommendations = samgimList.filter(samgim => {
        // 모든 긍정 키워드를 포함하고, 부정 키워드를 하나도 포함하지 않는 삼각김밥 필터링
        return positive.every(keyword => samgim.keywords.includes(keyword)) &&
               !negative.some(keyword => samgim.keywords.includes(keyword));
      });

      if (possibleRecommendations.length > 0) {
        const randomIndex = Math.floor(Math.random() * possibleRecommendations.length);
        return `오늘 당신에게 딱 맞는 삼각김밥은 바로 <span class="emoji">🍙</span> <b>${possibleRecommendations[randomIndex].name}</b> 입니다!`;
      } else {
        return "앗, 딱 맞는 삼각김밥을 찾지 못했어요. 좀 더 구체적으로 알려주시거나, 다른 키워드를 사용해 보세요!";
      }
    }

    /**
     * 추천 로직을 실행하고 결과를 화면에 표시합니다.
     */
    function handleRecommend() {
      const userInput = document.getElementById("userInput").value;
      const sandwichImageBox = document.getElementById("sandwichImageBox");
      const easterEgg = document.getElementById("easterEgg");
      const resultArea = document.getElementById("resultArea");

      console.log("입력값:", userInput); // 추가된 로그

      if (userInput.toLowerCase().includes("샌드위치")) {
        sandwichImageBox.style.display = "block"; // 샌드위치 이미지 박스 보이기
        easterEgg.style.display = "block";
        resultArea.innerHTML = "";
        return;
      } else {
        sandwichImageBox.style.display = "none"; // "샌드위치"가 아니면 숨기기
        easterEgg.style.display = "none";
      }

      const parsedKeywords = parseInput(userInput);
      console.log("추출된 키워드:", parsedKeywords); // 추가된 로그
      const recommendationResult = recommendSamgim(parsedKeywords);
      console.log("추천 결과:", recommendationResult); // 추가된 로그
      resultArea.innerHTML = recommendationResult;
    }

    function retry() {
      document.getElementById("userInput").value = "";
      document.getElementById("resultArea").innerHTML = "결과가 여기에 표시됩니다.";
      document.getElementById("easterEgg").style.display = "none";
      document.getElementById("sandwichImageBox").style.display = "none"; // retry 시에도 숨기기
      console.log("Retry requested - Fields cleared.");
    }
  </script>
